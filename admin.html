<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Retech Admin</title>
  <style>
    body{max-width:1100px;margin:auto}.admin{padding:45px 5%}.admin-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:25px}.admin h1{font:700 42px var(--display);letter-spacing:-.08em;margin:0}.admin-nav{display:flex;gap:8px;overflow:auto;margin:25px 0}.admin-nav button{padding:11px 15px;background:var(--white);border:1px solid var(--line);font-size:12px}.admin-nav button.active{background:var(--ink);color:var(--white)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:var(--lime);padding:22px}.metric:nth-child(2){background:var(--blue)}.metric:nth-child(3){background:var(--coral)}.metric:nth-child(4){background:var(--white)}.metric b{display:block;font:700 27px var(--display);margin-bottom:8px}.metric span{font-size:11px}.table-wrap{margin-top:35px;background:var(--white);padding:24px;overflow:auto}.panel-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.table-wrap h2{font:600 21px var(--display);margin:0}.admin-table{width:100%;border-collapse:collapse;font-size:12px}.admin-table th,.admin-table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.admin-table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.mode-badge{font-size:10px;background:var(--lime);padding:7px 9px}.admin-cta,.row-action{background:var(--ink);color:var(--white);padding:9px 12px;font-size:11px}.panel-heading h2 .admin-cta{margin-left:14px}.admin-toolbar{display:flex;gap:10px;margin-bottom:18px}.admin-toolbar input,.admin-toolbar select,.admin-form input{border:1px solid var(--line);background:var(--paper);padding:10px;font-size:12px}.admin-toolbar input{flex:1}.stock-input{width:65px;padding:7px;border:1px solid var(--line);background:var(--paper)}.row-action.saved{background:#58851f}.admin-empty{padding:60px 20px;background:var(--paper);display:flex;flex-direction:column;gap:9px}.admin-empty span{color:var(--muted);font-size:13px}.admin-list{display:grid;gap:10px}.admin-list div{display:grid;grid-template-columns:1fr 2fr auto;align-items:center;gap:15px;padding:17px;background:var(--paper);font-size:12px}.admin-list span{color:var(--muted)}.admin-list strong{color:#58851f;font-size:10px;text-transform:uppercase}.admin-form{margin-top:20px;padding:18px;background:var(--lime);display:grid;gap:10px}.admin-form h3{margin:0;font-family:var(--display)}@media(max-width:700px){.admin{padding:30px 5%}.admin h1{font-size:32px}.metrics{grid-template-columns:repeat(2,1fr)}.admin-head{display:block}.admin-list div{grid-template-columns:1fr}.panel-heading{align-items:start;gap:10px}.panel-heading h2{font-size:18px}}
  </style>
</head>
<body>
  <main class="admin">
    <div class="admin-head"><div><p class="eyebrow">Operations / Retech</p><h1>Good morning, admin.</h1></div><a class="text-button" href="index.html">← Storefront</a></div>
    <nav class="admin-nav"><button class="active" data-admin-tab="Overview">Overview</button><button data-admin-tab="Products">Products</button><button data-admin-tab="Orders">Orders</button><button data-admin-tab="Customers">Customers</button><button data-admin-tab="Coupons">Coupons</button><button data-admin-tab="Content">Content</button></nav>
    <section class="metrics"><div class="metric"><b>12</b><span>Active products</span></div><div class="metric"><b>8</b><span>Brands live</span></div><div class="metric"><b>1</b><span>Flash deal active</span></div><div class="metric"><b>₹0</b><span>Revenue this month</span></div></section>
    <div class="table-wrap" data-admin-panel></div>
    <div class="login-note" style="margin-top:25px">Connect these controls to the protected Retech API before production. Never place the Turso token or admin password in this GitHub Pages bundle.</div>
  </main>
</body>
<script src="admin.js?v=2"></script>
</html>
